<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nueva contraseña — MAQSIS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      border-radius: 1rem;
      box-shadow: 0 1rem 3rem rgba(0,0,0,.35);
    }
  </style>
</head>
<body>
  <div class="card login-card">
    <div class="card-body p-4">
      <h1 class="h4 text-center mb-1">Nueva contraseña</h1>
      <p class="text-muted text-center small mb-4">Elige una contraseña de al menos 4 caracteres</p>
      <form id="formReset">
        <input type="hidden" id="token">
        <div class="mb-3">
          <label class="form-label">Nueva contraseña</label>
          <input type="password" class="form-control" id="password" minlength="4" autocomplete="new-password" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label">Confirmar contraseña</label>
          <input type="password" class="form-control" id="passwordConfirm" minlength="4" autocomplete="new-password" required>
        </div>
        <div class="alert alert-danger d-none" id="errorReset"></div>
        <div class="alert alert-success d-none" id="okReset"></div>
        <button type="submit" class="btn btn-primary w-100" id="btnReset">Guardar contraseña</button>
      </form>
      <p class="text-center small mt-3 mb-0">
        <a href="/login.html">← Ir al inicio de sesión</a>
      </p>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const token = params.get('token') || '';
    document.getElementById('token').value = token;

    if (!token) {
      const err = document.getElementById('errorReset');
      err.textContent = 'Enlace inválido. Solicita uno nuevo desde la pantalla de recuperación.';
      err.classList.remove('d-none');
      document.getElementById('formReset').classList.add('d-none');
    }

    document.getElementById('formReset').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = document.getElementById('errorReset');
      const ok = document.getElementById('okReset');
      const btn = document.getElementById('btnReset');
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('passwordConfirm').value;

      err.classList.add('d-none');
      ok.classList.add('d-none');

      if (password !== confirm) {
        err.textContent = 'Las contraseñas no coinciden';
        err.classList.remove('d-none');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Guardando…';
      try {
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: document.getElementById('token').value, password })
        });
        const body = await res.json();
        if (!res.ok) throw new Error(body.message || 'Error al restablecer la contraseña');
        ok.textContent = body.message + ' Redirigiendo al login…';
        ok.classList.remove('d-none');
        document.getElementById('formReset').classList.add('d-none');
        setTimeout(() => { location.href = '/login.html'; }, 2500);
      } catch (ex) {
        err.textContent = ex.message;
        err.classList.remove('d-none');
        btn.disabled = false;
        btn.textContent = 'Guardar contraseña';
      }
    });
  </script>
</body>
</html>
