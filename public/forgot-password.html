<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recuperar contraseña — MAQSIS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      border-radius: 1rem;
      box-shadow: 0 1rem 3rem rgba(0,0,0,.35);
    }
  </style>
</head>
<body>
  <div class="card login-card">
    <div class="card-body p-4">
      <h1 class="h4 text-center mb-1">Recuperar contraseña</h1>
      <p class="text-muted text-center small mb-4">Ingresa el correo registrado en tu cuenta</p>
      <form id="formForgot">
        <div class="mb-3">
          <label class="form-label">Correo electrónico</label>
          <input type="email" class="form-control" id="email" autocomplete="email" required autofocus>
        </div>
        <div class="alert alert-danger d-none" id="errorForgot"></div>
        <div class="alert alert-success d-none" id="okForgot"></div>
        <button type="submit" class="btn btn-primary w-100" id="btnForgot">Enviar enlace</button>
      </form>
      <p class="text-center small mt-3 mb-0">
        <a href="/login.html">← Volver al inicio de sesión</a>
      </p>
    </div>
  </div>
  <script>
    document.getElementById('formForgot').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = document.getElementById('errorForgot');
      const ok = document.getElementById('okForgot');
      const btn = document.getElementById('btnForgot');
      err.classList.add('d-none');
      ok.classList.add('d-none');
      btn.disabled = true;
      btn.textContent = 'Enviando…';
      try {
        const res = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: document.getElementById('email').value.trim() })
        });
        const body = await res.json();
        if (!res.ok) throw new Error(body.message || 'Error al procesar la solicitud');
        ok.textContent = body.message;
        ok.classList.remove('d-none');
        document.getElementById('formForgot').querySelector('button[type="submit"]').disabled = true;
      } catch (ex) {
        err.textContent = ex.message;
        err.classList.remove('d-none');
        btn.disabled = false;
        btn.textContent = 'Enviar enlace';
      }
    });
  </script>
</body>
</html>
